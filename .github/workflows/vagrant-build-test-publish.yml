name: "Vagrant: Build, Test and Publish"
run-name: >-
  Vagrant: AlmaLinux ${{ inputs.version_major == '10-kitten' && 'Kitten 10' || inputs.version_major }} Build, Test and Publish (${{ inputs.vagrant_type }})

# Unified Vagrant pipeline: build the boxes with Packer, run the `vagrant up`
# smoke test, upload them to S3, and publish them in the AlmaLinux Vagrant box
# catalog on S3, served at https://vagrant.almalinux.org (which replaces the
# HCP Vagrant Registry: it stopped accepting new box versions on 2026-10-01
# and shuts down on 2026-12-31).
#
# Build + test + S3 upload come from shared-steps (run_test gates the live
# test). Each build leg whose box passed its test - the `vagrant up` test, or
# the offline validation for the legs without one - records it for the
# catalog; the publish-catalog job then adds all of them at once: one new
# version per catalog box (almalinux/10, almalinux/10-x86_64_v2, ...) with all
# its providers, so legs never race on the same catalog file and users never
# see a partly published version. Publishing is gated by release_to_catalog
# (on by default, so the scheduled runs publish) and runs in the AlmaLinux
# org's almalinux/cloud-images repository only - forks and ci-dev share the
# bucket, and must not change the production catalog.
#
# Hyper-V (vagrant_type ALL or vagrant_hyperv) builds as a leg of
# build-gh-hosted (x86_64 GitHub/RunsOn runner). It has NO live `vagrant up`
# test - a Hyper-V guest can't boot on the Linux runner - so build-gh-hosted
# forces run_test=false for the hyperv leg (only shared-steps' offline
# validation runs); the box is then published like the other providers.
#
# The VMware Desktop aarch64 box (vagrant_type ALL or vagrant_vmware) is built
# the Hyper-V way, as the vmware-aarch64 leg of build-gh-hosted: installed and
# provisioned under QEMU (TCG, the runner is x86_64) and packed into a
# vmware_desktop box by tools/raw-to-vagrant-vmware.sh. No runner can run
# VMware Fusion guests (GitHub's macOS runners expose no hypervisor), so it
# has no live `vagrant up` test either (run_test forced off, offline
# validation of the raw disk only). aarch64 has no x86_64_v2 variant, so the
# leg is excluded for the -v2 variants, and there is no AlmaLinux 8 box.
#
# The Parallels aarch64 box (vagrant_type ALL or vagrant_parallels) is built
# the same way, as the parallels-aarch64 leg of build-gh-hosted: installed
# and provisioned under QEMU (TCG), with the Parallels Tools ISO downloaded
# first, and packed into a parallels box by tools/raw-to-vagrant-parallels.sh.
# No runner can run Parallels Desktop guests, so it has no live `vagrant up`
# test either (run_test forced off, offline validation of the raw disk only).
# It is excluded for the -v2 variants, and there is no AlmaLinux 8 box.
#
# The VirtualBox aarch64 box (vagrant_type ALL or vagrant_virtualbox; for
# VirtualBox 7.1+ on Apple Silicon) is built the same way, as the
# virtualbox-aarch64 leg of build-gh-hosted: installed and provisioned under
# QEMU (TCG), with the VirtualBox Guest Additions ISO downloaded first, and
# packed into a virtualbox box by tools/raw-to-vagrant-virtualbox.sh. No
# runner can run VirtualBox ARM guests, so it has no live `vagrant up` test
# either (run_test forced off, offline validation of the raw disk only). It
# is excluded for the -v2 variants, and there is no AlmaLinux 8 box.
#
# Stage implementations:
#   .github/actions/shared-steps        - Packer build + vagrant up smoke test + S3 upload
#   .github/scripts/vagrant-catalog-add.py - add the built boxes to the catalog
#     (tools/vagrant_catalog.py builds the whole catalog from scratch)

on:
  workflow_dispatch:
      inputs:

        date_time_stamp:
          description: 'Custom date+time stamp, YYYYMMDDhhmmss'
          required: false
          default: ''

        version_major:
          description: 'AlmaLinux major version'
          required: true
          default: '10'
          type: choice
          options:
            - 10-kitten
            - 10
            - 9
            - 8

        vagrant_type:
          description: 'Vagrant image type'
          required: true
          default: 'ALL'
          type: choice
          options:
            - ALL
            - vagrant_libvirt
            - vagrant_virtualbox
            - vagrant_vmware
            - vagrant_hyperv
            - vagrant_parallels

        self-hosted:
          description: "Build on self-hosted runner"
          required: true
          type: boolean
          default: true

        self_hosted_runner:
          description: 'self-hosted runner'
          required: true
          default: 'aws-ec2'
          type: choice
          options:
            - self-hosted
            - aws-ec2

        run_test:
          description: "Do image simple testing and generate installed packages list"
          required: true
          type: boolean
          default: true

        store_as_artifact:
          description: "Store images to the workflow Artifacts"
          required: true
          type: boolean
          default: false

        upload_to_s3:
          description: "Upload to S3 Bucket"
          required: true
          type: boolean
          default: true

        # The AlmaLinux Vagrant box catalog on S3 (replaces the HCP Vagrant
        # Registry, closed to new versions since 2026-10-01). Needs
        # upload_to_s3; applies in almalinux/cloud-images only.
        release_to_catalog:
          description: "Publish the tested boxes in the Vagrant box catalog on S3 (almalinux/cloud-images only)"
          required: true
          type: boolean
          default: true

        notify_mattermost:
          description: "Send notification to Mattermost"
          required: true
          type: boolean
          default: true
env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
  # The Vagrant box catalog: s3://<AWS_S3_BUCKET>/<VAGRANT_CATALOG_PREFIX>/<org>/<box>[.json],
  # served at VAGRANT_SERVER_URL (CloudFront in front of the bucket's
  # <prefix>/ folder: the address users set); the box URLs in it point at
  # VAGRANT_BOX_BASE_URL/<S3 key>
  VAGRANT_SERVER_URL: https://vagrant.almalinux.org
  VAGRANT_CATALOG_PREFIX: vagrant
  VAGRANT_CATALOG_ORG: almalinux
  VAGRANT_BOX_BASE_URL: https://${{ vars.AWS_S3_BUCKET }}.s3.amazonaws.com

jobs:
  init-data:
    name: Initialize common data
    runs-on: ubuntu-24.04
    outputs:
      time_stamp: ${{ steps.date-time-stamp.outputs.time_stamp }}
      date_stamp: ${{ steps.date-time-stamp.outputs.date_stamp }}
      matrix_gh: ${{ steps.set-matrix.outputs.matrix_gh }}
      matrix_sh: ${{ steps.set-matrix.outputs.matrix_sh }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          # Build matrix is json array of string elements like:
          matrix_gh=  #  ["vagrant_libvirt-x86_64", "vagrant_virtualbox-x86_64"]
          matrix_sh=  #  ["vagrant_vmware-x86_64"]

          if [ "${{ inputs.vagrant_type }}" = "vagrant_libvirt" -o "${{ inputs.vagrant_type }}" = "ALL" ]; then
            if [ "${{ inputs.self-hosted }}" = "true" -a "${{ inputs.self_hosted_runner }}" = "self-hosted" ]; then
              VARIANTS_SH+=("vagrant_libvirt-x86_64")
            else
              VARIANTS_GH+=("vagrant_libvirt-x86_64")
            fi
          fi
          if [ "${{ inputs.vagrant_type }}" = "vagrant_virtualbox" -o "${{ inputs.vagrant_type }}" = "ALL" ]; then
            if [ "${{ inputs.self-hosted }}" = "true" -a "${{ inputs.self_hosted_runner }}" = "self-hosted" ]; then
              VARIANTS_SH+=("vagrant_virtualbox-x86_64")
            else
              VARIANTS_GH+=("vagrant_virtualbox-x86_64") # tests aren't work on GitHub runners, use self-hosted to run tests
            fi
          fi
          if [ "${{ inputs.vagrant_type }}" = "vagrant_vmware" -o "${{ inputs.vagrant_type }}" = "ALL" ]; then
              VARIANTS_SH+=("vagrant_vmware-x86_64") # VMware has networking issues on GitHub runners, so we use self-hosted runner
          fi
          if [ "${{ inputs.vagrant_type }}" = "vagrant_hyperv" -o "${{ inputs.vagrant_type }}" = "ALL" ]; then
              # Hyper-V always builds on the GitHub/RunsOn x86_64 runner; it has
              # no live test (a Hyper-V guest can't boot on the Linux runner), so
              # the build-gh-hosted leg forces run_test=false for it.
              VARIANTS_GH+=("hyperv-x86_64")
          fi
          if [ "${{ inputs.vagrant_type }}" = "vagrant_vmware" -o "${{ inputs.vagrant_type }}" = "ALL" ] \
             && [ "${{ inputs.version_major }}" != "8" ]; then
              # VMware aarch64: built under QEMU (TCG) and converted, like Hyper-V;
              # no live test, see the header. There is no AlmaLinux 8 box.
              VARIANTS_GH+=("vmware-aarch64")
          fi
          if [ "${{ inputs.vagrant_type }}" = "vagrant_parallels" -o "${{ inputs.vagrant_type }}" = "ALL" ] \
             && [ "${{ inputs.version_major }}" != "8" ]; then
              # Parallels aarch64: built under QEMU (TCG) and converted, like
              # Hyper-V; no live test, see the header. There is no AlmaLinux 8 box.
              VARIANTS_GH+=("parallels-aarch64")
          fi
          if [ "${{ inputs.vagrant_type }}" = "vagrant_virtualbox" -o "${{ inputs.vagrant_type }}" = "ALL" ] \
             && [ "${{ inputs.version_major }}" != "8" ]; then
              # VirtualBox aarch64: built under QEMU (TCG) and converted, like
              # Parallels; no live test, see the header. There is no AlmaLinux 8 box.
              VARIANTS_GH+=("virtualbox-aarch64")
          fi

          [ ${#VARIANTS_GH[@]} -ne 0 ] && matrix_gh=$(printf '"%s",' "${VARIANTS_GH[@]}")
          matrix_gh=${matrix_gh%,}  # Remove the trailing comma
          echo matrix_gh=$(jq -c <<< [${matrix_gh}]) >> $GITHUB_OUTPUT
          echo "[Debug] on GitHub Hosted [${matrix_gh}]"

          [ ${#VARIANTS_SH[@]} -ne 0 ] && matrix_sh=$(printf '"%s",' "${VARIANTS_SH[@]}")
          matrix_sh=${matrix_sh%,}  # Remove the trailing comma
          echo matrix_sh=$(jq -c <<< [${matrix_sh}]) >> $GITHUB_OUTPUT
          echo "[Debug] on Self Hosted [${matrix_sh}]"

      - name: Date+time stamp
        id: date-time-stamp
        run: |
          # date+time stamp, YYYYMMDDhhmmss
          if [ "${{ inputs.date_time_stamp }}" != "" ]; then
            date_time_stamp="${{ inputs.date_time_stamp }}"
          else
            date_time_stamp=$(date -u '+%Y%m%d%H%M%S')
          fi
          echo "time_stamp=${date_time_stamp}" >> $GITHUB_OUTPUT

          # date stamp, YYYYMMDD
          date_stamp=${date_time_stamp:0:-6}
          echo "date_stamp=${date_stamp}" >> "$GITHUB_OUTPUT"


  build-gh-hosted:
    name: ${{ matrix.variant }} ${{ matrix.matrix_gh }} build+test+publish
    permissions:
      id-token: write
      contents: read
    needs: [init-data]
    if: ${{ needs.init-data.outputs.matrix_gh != '[]' }}
    # use runs-on runners if within the almalinux org, otherwise GH runners.
    # The QEMU-built aarch64 legs (vmware-aarch64, parallels-aarch64,
    # virtualbox-aarch64):
    # - in the AlmaLinux org: RunsOn arm64 bare metal (a1.metal or a newer
    #   Graviton .metal, whichever is free), where shared-steps
    #   builds natively under KVM (-cpu host).
    # - elsewhere: GitHub's x86_64 Ubuntu 24.04, like the other legs, where
    #   shared-steps emulates the install under TCG (see its environment
    #   step for the CPU model).
    # No AlmaLinux 8 box is built on the aarch64 legs.
    runs-on: >-
      ${{
        github.repository_owner == 'AlmaLinux' &&
          (endsWith(matrix.matrix_gh, '-aarch64') &&
            format('runs-on={0}/family=a1.metal+c6g.metal+m6g.metal+c7g.metal+m7g.metal+*8gd.metal*/image=ubuntu24-full-arm64/volume=60g/spot=false', github.run_id) ||
            format('runs-on={0}/family=r8i.2xlarge/image=ubuntu24-full-x64/volume=60g/spot=false/nested-virt', github.run_id))
        ||
        'ubuntu-24.04'
      }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', ( inputs.version_major == '10-kitten' || inputs.version_major == '10' ) && format('{0}", "{0}-v2', inputs.version_major) || inputs.version_major )) }}
        matrix_gh: ${{ fromJSON(needs.init-data.outputs.matrix_gh) }}
        # aarch64 has no x86_64_v2 variant
        exclude:
          - variant: 10-v2
            matrix_gh: vmware-aarch64
          - variant: 10-kitten-v2
            matrix_gh: vmware-aarch64
          - variant: 10-v2
            matrix_gh: parallels-aarch64
          - variant: 10-kitten-v2
            matrix_gh: parallels-aarch64
          - variant: 10-v2
            matrix_gh: virtualbox-aarch64
          - variant: 10-kitten-v2
            matrix_gh: virtualbox-aarch64

    env:
      TIME_STAMP: ${{ needs.init-data.outputs.time_stamp }}
      DATE_STAMP: ${{ needs.init-data.outputs.date_stamp }}

    steps:
      - name: Prepare some environment variables
        run: |
          # Read image type
          IFS=- read -r type arch <<< "${{ matrix.matrix_gh }}"
          echo "type=$type" >> $GITHUB_ENV
          echo "ARCH=$arch" >> $GITHUB_ENV
          # Hyper-V and the QEMU-built VMware / Parallels / VirtualBox aarch64
          # boxes have no live `vagrant up` test (their guests can't boot on the
          # Linux runner), so force run_test off for them; honor the input for
          # the libvirt / x86_64 virtualbox legs.
          if [ "$type" = "hyperv" ] || [ "$type" = "vmware" ] || [ "$type" = "parallels" ] || [ "$type" = "virtualbox" ]; then
            echo "RUN_TEST=false" >> $GITHUB_ENV
          else
            echo "RUN_TEST=${{ inputs.run_test }}" >> $GITHUB_ENV
          fi

      - name: Checkout ${{ github.action_repository }}
        uses: actions/checkout@v6

      - name: Download the Parallels Tools ISO
        if: env.type == 'parallels'
        env:
          PRL_TOOLS_ISO: prl-tools-lin-arm.iso
          # Parallels Tools 26.x: the 27.x prl_fsd needs FUSE 3, which drops the
          # big_writes option the vagrant-parallels plugin (2.4.9) still passes
          # when it mounts the shared folders
          PRL_TOOLS_ISO_URL: https://almalinux-images.s3.us-east-1.amazonaws.com/tools/parallels/26/prl-tools-lin-arm.iso
        run: |
          # The parallels-iso builder takes the Tools ISO from Parallels
          # Desktop; the QEMU-built box installs it from this copy, which the
          # packer template uploads into the guest (parallels_tools_iso_aarch64).
          curl -fsSL --retry 3 -o "${PRL_TOOLS_ISO}" "${PRL_TOOLS_ISO_URL}"
          ls -la "${PRL_TOOLS_ISO}"

      - name: Download the VirtualBox Guest Additions ISO
        if: env.type == 'virtualbox'
        env:
          # 7.2.20+: the first Guest Additions whose vboxsf builds against
          # the EL10 / Kitten 6.12 kernels; its ISO carries the arm64 Linux
          # installer (VBoxLinuxAdditions-arm64.run)
          VBOX_VERSION: 7.2.20
          VBOX_GA_ISO: VBoxGuestAdditions.iso
        run: |
          # The virtualbox-iso builder takes the Guest Additions ISO from the
          # installed VirtualBox; the QEMU-built box installs it from this
          # copy, which the packer template uploads into the guest
          # (virtualbox_guest_additions_iso_aarch64). Verified against
          # Oracle's published checksums.
          base_url="https://download.virtualbox.org/virtualbox/${VBOX_VERSION}"
          curl -fsSL --retry 3 -o "${VBOX_GA_ISO}" "${base_url}/VBoxGuestAdditions_${VBOX_VERSION}.iso"
          expected=$(curl -fsSL --retry 3 "${base_url}/SHA256SUMS" | awk -v f="*VBoxGuestAdditions_${VBOX_VERSION}.iso" '$2 == f { print $1 }')
          [ -n "${expected}" ] || { echo "[Error] No checksum for VBoxGuestAdditions_${VBOX_VERSION}.iso"; exit 1; }
          echo "${expected}  ${VBOX_GA_ISO}" | sha256sum -c -
          ls -la "${VBOX_GA_ISO}"

      - uses: ./.github/actions/shared-steps
        name: ${{ matrix.variant }} ${{ matrix.matrix_gh }} image
        with:
          type: ${{ env.type }}
          variant: ${{ matrix.variant }}
          arch: ${{ env.ARCH }}
          S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ vars.MATTERMOST_CHANNEL }}
          store_as_artifact: ${{ inputs.store_as_artifact }}
          upload_to_s3: ${{ inputs.upload_to_s3 }}
          notify_mattermost: ${{ inputs.notify_mattermost }}
          run_test: ${{ env.RUN_TEST }}
          runner: ${{ github.repository_owner == 'AlmaLinux' && 'aws-ec2' || 'gh_hosted' }}
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}

      # Record the box for the publish-catalog job: only once it is on S3 and
      # passed its test (got_pkgs_list: the `vagrant up` test, or the offline
      # validation for the legs without one), and only in the repository
      # that publishes the catalog
      - name: Record the box for the catalog
        if: ${{ inputs.release_to_catalog && inputs.upload_to_s3 && github.repository == 'AlmaLinux/cloud-images' && env.got_pkgs_list == 'true' }}
        run: |
          # Record the box for the catalog
          python3 - <<'EOF'
          import json, os
          image = os.environ["IMAGE_FILE"]
          with open(f"{image}.sha256sum") as f:
              sha256 = f.read().split()[0]
          entry = {"file": os.environ["IMAGE_NAME"],
                   "s3_key": f"{os.environ['AWS_S3_PATH']}/{os.environ['IMAGE_NAME']}",
                   "sha256": sha256}
          with open("catalog-entry.json", "w") as f:
              json.dump(entry, f)
          print(json.dumps(entry, indent=2))
          EOF

      - name: Hand the box over to the publish-catalog job
        if: ${{ inputs.release_to_catalog && inputs.upload_to_s3 && github.repository == 'AlmaLinux/cloud-images' && env.got_pkgs_list == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: catalog-entry-${{ matrix.variant }}-${{ matrix.matrix_gh }}
          path: catalog-entry.json
          retention-days: 1
          if-no-files-found: error

  # The job is to start self-hosted runner on AWS EC2 instance if not in the almalinux org
  # It does nothing if in the almalinux org, so 'Setup and start runner' step is skipped
  start-self-hosted-runner:
    name: ${{ matrix.variant }} ${{ matrix.matrix_sh }} runner
    if: ${{ inputs.self-hosted && needs.init-data.outputs.matrix_sh != '[]' }}
    runs-on: ubuntu-24.04
    needs: [init-data]
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', ( inputs.version_major == '10' || inputs.version_major == '10-kitten' ) && format('{0}", "{0}-v2', inputs.version_major) || inputs.version_major )) }}
        matrix_sh: ${{ fromJSON(needs.init-data.outputs.matrix_sh) }}

    steps:
    - name: Setup and start runner
      if: inputs.self_hosted_runner == 'aws-ec2' && github.repository_owner != 'AlmaLinux'
      uses: unblocked/ec2-action-builder@v1.12
      with:
        github_token: ${{ secrets.GIT_HUB_TOKEN }}
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws_region: ${{ vars.AWS_REGION }}
        ec2_ami_id: ${{ secrets.EC2_AMI_ID_AL9_X86_64 }}

        ec2_subnet_id: ${{ secrets.EC2_SUBNET_ID}}                  # Subnet and Security Group should match
        ec2_security_group_id: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        ec2_instance_type: c5n.metal

        ec2_root_disk_size_gb: "16"         # override default size which is too small for actions and tests stuff
        ec2_root_disk_ebs_class: "gp3"      # use faster and cheeper storage instead of default 'gp2'
        ec2_instance_ttl: 30                # Optional (default is 60 minutes)
        ec2_spot_instance_strategy: None    # Other options are: SpotOnly, BestEffort, MaxPerformance
        ec2_instance_tags: >                # Required for IAM role resource permission scoping
          [
            {"Key": "Project", "Value": "GitHub Actions Self-hosted Runners"}
          ]

  build-self-hosted:
    name: ${{ matrix.variant }} ${{ matrix.matrix_sh }} build+test+publish
    permissions:
      id-token: write
      contents: read
    if: ${{ inputs.self-hosted && needs.init-data.outputs.matrix_sh != '[]' }}
    needs: [init-data, start-self-hosted-runner]
    # If almalinux org, use RunsOn with:
    # - AlmaLinux 9.x x86_64 specific AWS AMI ID (need to build Vagrant for VMware)
    #
    # Otherwise use AWS EC2 Self-Hosted x86_64 runner set up with the 'start-self-hosted-runner' job above
    #
    # Or use manually set up runner.
    runs-on: >-
      ${{
        github.repository_owner == 'AlmaLinux' &&
          format('runs-on={0}/family=r8i.2xlarge/ami={1}/volume=60g/spot=false/nested-virt', github.run_id, vars.EC2_AMI_ID_AL9_X86_64)
        ||
        inputs.self_hosted_runner == 'aws-ec2' && github.run_id
        ||
        matrix.matrix_sh
      }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', ( inputs.version_major == '10' || inputs.version_major == '10-kitten' ) && format('{0}", "{0}-v2', inputs.version_major) || inputs.version_major )) }}
        matrix_sh: ${{ fromJSON(needs.init-data.outputs.matrix_sh) }}

    env:
      TIME_STAMP: ${{ needs.init-data.outputs.time_stamp }}
      DATE_STAMP: ${{ needs.init-data.outputs.date_stamp }}

    steps:
      - name: Prepare some environment variables
        run: |
          # Read image type
          IFS=- read -r type arch <<< "${{ matrix.matrix_sh }}"
          echo "type=$type" >> $GITHUB_ENV
          echo "ARCH=$arch" >> $GITHUB_ENV

      - name: Clean up runner
        if: inputs.self_hosted_runner != 'aws-ec2'
        run: sudo rm -rf ansible .vagrant output-*

      - name: Checkout ${{ github.action_repository }}
        uses: actions/checkout@v6

      - uses: ./.github/actions/shared-steps
        name: ${{ matrix.variant }} ${{ matrix.matrix_sh }} image
        with:
          type: ${{ env.type }}
          variant: ${{ matrix.variant }}
          arch: ${{ env.ARCH }}
          S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ vars.MATTERMOST_CHANNEL }}
          store_as_artifact: ${{ inputs.store_as_artifact }}
          upload_to_s3: ${{ inputs.upload_to_s3 }}
          notify_mattermost: ${{ inputs.notify_mattermost }}
          run_test: ${{ inputs.run_test }}
          runner: >-
            ${{
              github.repository_owner == 'AlmaLinux' && 'aws-ec2'
              || inputs.self_hosted_runner == 'aws-ec2' && 'aws-ec2'
              || 'self_hosted'
            }}
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}

      # Record the box for the publish-catalog job: only once it is on S3 and
      # passed its test (got_pkgs_list: the `vagrant up` test, or the offline
      # validation for the legs without one), and only in the repository
      # that publishes the catalog
      - name: Record the box for the catalog
        if: ${{ inputs.release_to_catalog && inputs.upload_to_s3 && github.repository == 'AlmaLinux/cloud-images' && env.got_pkgs_list == 'true' }}
        run: |
          # Record the box for the catalog
          python3 - <<'EOF'
          import json, os
          image = os.environ["IMAGE_FILE"]
          with open(f"{image}.sha256sum") as f:
              sha256 = f.read().split()[0]
          entry = {"file": os.environ["IMAGE_NAME"],
                   "s3_key": f"{os.environ['AWS_S3_PATH']}/{os.environ['IMAGE_NAME']}",
                   "sha256": sha256}
          with open("catalog-entry.json", "w") as f:
              json.dump(entry, f)
          print(json.dumps(entry, indent=2))
          EOF

      - name: Hand the box over to the publish-catalog job
        if: ${{ inputs.release_to_catalog && inputs.upload_to_s3 && github.repository == 'AlmaLinux/cloud-images' && env.got_pkgs_list == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: catalog-entry-${{ matrix.variant }}-${{ matrix.matrix_sh }}
          path: catalog-entry.json
          retention-days: 1
          if-no-files-found: error

  # Publish the boxes the build legs recorded (on S3 and tested) in the
  # Vagrant box catalog on S3, all at once: download the touched catalog
  # files, add one version per catalog box with all its providers, keep the
  # previous files under <prefix>/.history/<time stamp>/, and upload the new
  # ones. AlmaLinux org's almalinux/cloud-images only (see the header).
  publish-catalog:
    name: Publish the boxes to the Vagrant catalog
    needs: [init-data, build-gh-hosted, build-self-hosted]
    if: ${{ !cancelled() && inputs.release_to_catalog && inputs.upload_to_s3 && github.repository == 'AlmaLinux/cloud-images' }}
    runs-on: ubuntu-24.04
    # One catalog update at a time, across runs too: a catalog file's
    # download-change-upload must not interleave with another. Queued, not
    # cancelled.
    concurrency:
      group: vagrant-catalog
      cancel-in-progress: false
    env:
      TIME_STAMP: ${{ needs.init-data.outputs.time_stamp }}
      BUCKET: ${{ vars.AWS_S3_BUCKET }}

    steps:
      - name: Checkout ${{ github.action_repository }}
        uses: actions/checkout@v6

      # No artifact at all (every leg failed or was not tested) is not an
      # error here: the next step finds no box and the job does nothing
      - name: Take over the recorded boxes
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: catalog-entry-*
          path: catalog-entries

      - name: List the recorded boxes
        id: entries
        run: |
          # List the recorded boxes
          # The catalog is read and checked on the bucket itself, not through
          # VAGRANT_SERVER_URL, whose CDN may serve a file up to its max-age old
          echo "CATALOG_URL=https://${BUCKET}.s3.us-east-1.amazonaws.com/${VAGRANT_CATALOG_PREFIX}" >> "$GITHUB_ENV"
          entries=$(find catalog-entries -name catalog-entry.json 2>/dev/null | sort || true)
          echo "count=$(echo -n "${entries}" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          for entry in ${entries}; do cat "${entry}"; echo; done
          [ -n "${entries}" ] || echo "[Info] No tested box to publish"

      - name: Configure AWS credentials
        if: steps.entries.outputs.count != '0'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Add the boxes to the catalog
        if: steps.entries.outputs.count != '0'
        run: |
          # Add the boxes to the catalog
          {
            echo "### Vagrant box catalog"
            echo ""
            echo "Catalog: ${VAGRANT_SERVER_URL} (\`VAGRANT_SERVER_URL\`)"
            echo ""
          } > catalog-report.md
          # shellcheck disable=SC2046 # one argument per entry file
          .github/scripts/vagrant-catalog-add.py \
            --entry $(find catalog-entries -name catalog-entry.json | sort) \
            --catalog-url "${CATALOG_URL}" \
            --box-url "${VAGRANT_BOX_BASE_URL}" \
            --org "${VAGRANT_CATALOG_ORG}" \
            --out catalog-new \
            --previous catalog-previous \
            --changed catalog-changed.txt \
            --report catalog-report.md
          cat catalog-report.md

      - name: Upload the catalog to S3
        if: steps.entries.outputs.count != '0'
        run: |
          # Upload the catalog to S3
          prefix="${VAGRANT_CATALOG_PREFIX}/${VAGRANT_CATALOG_ORG}"
          while read -r box; do
            # The previous file, private (untagged), to roll back from
            aws s3 cp --only-show-errors "catalog-previous/${VAGRANT_CATALOG_ORG}/${box}.json" \
              "s3://${BUCKET}/${VAGRANT_CATALOG_PREFIX}/.history/${TIME_STAMP}/${VAGRANT_CATALOG_ORG}/${box}.json"
            # <box> for VAGRANT_SERVER_URL (Vagrant requires the JSON
            # content type), <box>.json for browsers and box_url
            for name in "${box}" "${box}.json"; do
              aws s3api put-object --bucket "${BUCKET}" --key "${prefix}/${name}" \
                --body "catalog-new/${VAGRANT_CATALOG_ORG}/${name}" \
                --content-type application/json --cache-control 'max-age=300' \
                --tagging 'public=yes' --output text --query ETag
            done
          done < catalog-changed.txt

      - name: Check the published catalog
        if: steps.entries.outputs.count != '0'
        run: |
          # Check the published catalog: public, JSON, and what was uploaded
          while read -r box; do
            for name in "${box}" "${box}.json"; do
              url="${CATALOG_URL}/${VAGRANT_CATALOG_ORG}/${name}"
              type=$(curl -fsSI "${url}" | tr -d '\r' | awk 'tolower($1) == "content-type:" { print $2 }')
              [ "${type}" = "application/json" ] || { echo "[Error] ${url}: content type '${type}'"; exit 1; }
              curl -fsS "${url}" | cmp -s - "catalog-new/${VAGRANT_CATALOG_ORG}/${name}" \
                || { echo "[Error] ${url} differs from the uploaded file"; exit 1; }
              echo "[Info] ${url}: OK"
            done
          done < catalog-changed.txt

      - name: Print job summary
        if: always() && steps.entries.outputs.count != '0' && hashFiles('catalog-report.md') != ''
        run: cat catalog-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Read the Mattermost message
        if: always() && inputs.notify_mattermost && steps.entries.outputs.count != '0'
        run: |
          {
            echo 'CATALOG_REPORT<<EOF'
            sed -n 's/^- //p' catalog-report.md 2>/dev/null | sed 's/^/- /'
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Send notification to Mattermost
        uses: mattermost/action-mattermost-notify@master
        if: always() && inputs.notify_mattermost && steps.entries.outputs.count != '0'
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ vars.MATTERMOST_CHANNEL }}
          MATTERMOST_USERNAME: ${{ github.triggering_actor }}
          TEXT: |
            :almalinux: **Vagrant box catalog**: ${{ job.status == 'success' && 'published' || 'publishing FAILED' }}, by the GitHub [Action](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ env.CATALOG_REPORT }}

            Catalog: ${{ env.VAGRANT_SERVER_URL }}
