# cloud-utils-growpart and dracut-config-generic are preinstalled by the
# kickstarts. cloud-init stays here: the gencloud x86_64/x86_64_v2/aarch64
# kickstarts are shared with OpenNebula (whose images must not have it) and
# the Vagrant ones with VMware (where a preinstalled, not-yet-configured
# cloud-init activates on the first boot and breaks the networking), so it
# is a no-op only where a kickstart preinstalls it (Azure, OCI, ppc64le).
- name: Install cloud-init
  dnf:
    name: cloud-init

- name: Enable cloud-init services
  service:
    name: "{{ item }}"
    enabled: true
  with_items:
    - cloud-config
    - cloud-init
    - cloud-init-local
    - cloud-final

- name: Configure cloud-init user name
  replace:
    dest: /etc/cloud/cloud.cfg
    regexp: '^(\s+name:).*$'
    replace: "\\1 {{ cloud_init_user }}"
  when: cloud_init_user | length > 0


- include_tasks: azure.yml
  when: cloud_platform == 'azure'

- ansible.builtin.include_tasks: oci.yaml
  when: cloud_platform == 'oci'
