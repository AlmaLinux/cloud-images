[libvirt]
cpus = 2
memory = 3072
image_type = qcow2

[cache]
original_media = no

# The s390x build host also runs openQA worker VMs. Under that load the
# kickstart install stays active but no longer fits oz's default 1200s
# absolute install budget ("Timed out waiting for install to finish").
# The 300s inactivity guard still catches a genuinely hung install.
[timeouts]
install = 3600
